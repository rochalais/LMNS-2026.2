<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exposição Virtual Vozes Negras e Indigenas</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="transicao.css" />
  </head>
  <body>
    <div class="div_transicao"></div>
    <main>
      <section class="home-hero" aria-labelledby="titulo-exposicao">
        <h1 id="titulo-exposicao">
          <span class="home-hero__sobretitulo">Conheça a exposição</span>
          <span class="home-hero__nome">Vozes Negras <span>e Indígenas</span></span>
        </h1>
        <p class="home-hero__introducao">
          Uma exposição digital sobre 20 trajetórias de mulheres indígenas e
          negras que marcaram a história, a cultura, a resistência e a memória
          coletiva.
        </p>
        <a class="home-hero__acao" href="#catalogo">Conhecer exposição</a>
        <span class="home-hero__dica" aria-hidden="true">Role para entrar</span>
      </section>
    </main>
    <script>
      window.addEventListener("load", () => {
        const transicao = document.querySelector(".div_transicao");

        if (transicao) {
          transicao.style.opacity = "0";
          window.setTimeout(() => {
            transicao.style.display = "none";
          }, 500);
        }
      });

      const exposicao = document.querySelector(".exposicao-fade");
      const botaoConhecerExposicao = document.querySelector(".home-hero__acao");

      if (exposicao) {
        const reduzirMovimento = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        if ("IntersectionObserver" in window && !reduzirMovimento) {
          exposicao.classList.add("exposicao-fade--aguardando");

          const observador = new IntersectionObserver(
            ([entrada]) => {
              if (entrada.isIntersecting) {
                exposicao.classList.add("visivel");
                observador.disconnect();
              }
            },
            { threshold: 0.18 },
          );

          observador.observe(exposicao);
        } else {
          exposicao.classList.add("visivel");
        }
      }

      if (botaoConhecerExposicao && exposicao) {
        botaoConhecerExposicao.addEventListener("click", () => {
          window.setTimeout(
            () => exposicao.focus({ preventScroll: true }),
            500,
          );
        });
      }
    </script>
  </body>
</html>
